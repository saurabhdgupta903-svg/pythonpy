{% extends "base.html" %}

{% block title %}Student Login{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-clean shadow-sm">
        <div class="card-header-clean bg-white p-4 border-bottom text-center">
          <div class="mb-2">
            <span class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle" style="width: 48px; height: 48px;">
              <i class="bi bi-person-fill fs-4"></i>
            </span>
          </div>
          <h4 class="fw-bold mb-1">Student Sign In</h4>
          <p class="text-muted small mb-0">Access your placement applications and eligible company drives</p>
        </div>

        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('student_login', next=request.args.get('next')) }}">
            <div class="mb-3">
              <label for="email" class="form-label">College Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="name@college.edu" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter your password" required>
              </div>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
              </button>
            </div>

            <div class="text-center pt-2">
              <span class="text-muted small">Don't have an account yet?</span>
              <a href="{{ url_for('student_register') }}" class="small fw-semibold text-primary ms-1">Register as a Student</a>
            </div>
          </form>
        </div>

        <div class="card-footer bg-light border-top text-center py-2">
          <small class="text-muted">
            Are you a placement administrator? <a href="{{ url_for('admin_login') }}" class="text-secondary fw-semibold">Admin Login</a>
          </small>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
